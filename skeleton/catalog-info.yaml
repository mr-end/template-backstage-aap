apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{ values.projectName }}
  description: ${{ values.projectDescription }}
  annotations:
    # Namespace/cluster onde os componentes deste System vivem.
    # A aba Kubernetes no RHDH aparece de forma confiável no Component
    # (httpd), não necessariamente na página do System.
    backstage.io/kubernetes-namespace: ${{ values.projectName }}
    backstage.io/kubernetes-cluster: aro-lab
spec:
  owner: user:default/victorfim
