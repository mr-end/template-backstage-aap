apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{ values.projectName }}
  description: ${{ values.projectDescription }}
  annotations:
    # A aba Kubernetes do RHDH exige kubernetes-id (ou um label-selector).
    # O valor é o nome do projeto; os objetos no cluster precisam ter o
    # label backstage.io/kubernetes-id=<nome-do-projeto> para aparecerem.
    backstage.io/kubernetes-id: ${{ values.projectName }}
    backstage.io/kubernetes-namespace: ${{ values.projectName }}
    backstage.io/kubernetes-cluster: aro-lab
spec:
  owner: user:default/victorfim
