apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-openshift-project-aap
  title: Create Openshift Project
  description: >-
    Cria um novo projeto no OpenShift via AAP (CreateProject), publica o
    repositório no GitHub e, opcionalmente, dispara o template DeployHttpd
  tags:
    - ansible
    - aap
    - automation
    - openshift
    - v0-7-3
  labels:
    version: 0.7.3
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Ansible Automation Platform
      url: https://aap-hub-aap.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: automation
  owner: user:default/victorfim
  lifecycle: production

  parameters:
    - title: Criar Projeto no OpenShift
      description: >
        Este template executa o playbook **CreateProject** (projeto
        Ansible-Examples) no AAP para criar um novo projeto no OpenShift.
        A execução usa suas credenciais do AAP e aguarda o término do job.
        Se marcado, dispara em seguida o template DeployHttpd (publica
        manifests no Git para o Argo CD sincronizar) como task separada.
      required:
        - projectName
      properties:
        projectName:
          title: Nome do Projeto
          type: string
          description: >-
            Nome do projeto/namespace a ser criado no OpenShift (letras
            minúsculas, números e hífens)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

        displayName:
          title: Nome de Exibição
          type: string
          description: Nome amigável exibido no console do OpenShift (opcional)

        projectDescription:
          title: Descrição do Projeto
          type: string
          description: Descrição do propósito do projeto (opcional)

        deployHttpd:
          title: Disparar DeployHttpd após criar o projeto
          type: boolean
          description: >-
            Se marcado, dispara o template DeployHttpd (task independente)
            após a criação do projeto e do repositório. O DeployHttpd gera
            os manifests no Git; o Argo CD sincroniza sozinho.
          default: false

    - title: Repositório
      description: >
        Após a criação do projeto no AAP, um repositório é criado no GitHub
        (com o mesmo nome do projeto) e registrado automaticamente no
        Catalog do Backstage.
      required:
        - githubOwner
      properties:
        githubOwner:
          title: Organização/Owner no GitHub
          type: string
          description: >-
            Organização ou usuário do GitHub onde o repositório será criado.
            O nome do repositório será o mesmo nome do projeto.

  steps:

    # Único step que usa AAP: cria o projeto/namespace no OpenShift.
    - id: launch-job-template
      name: Criar projeto no OpenShift (AAP)
      action: rhaap:launch-job-template
      input:
        token: ${{ environment.secrets.aapToken }}
        waitForCompletion: true
        values:
          # Job Template "CreateProject" do projeto "Ansible-Examples" no AAP
          template: CreateProject
          extraVariables: |-
            project_name: ${{ parameters.projectName }}
            project_display_name: ${{ parameters.displayName }}
            project_description: ${{ parameters.projectDescription }}

    - id: log-output
      name: Registrar resultado da execução AAP
      action: debug:log
      input:
        message: >-
          Job Template "CreateProject" finalizado.
          Job ID: ${{ steps['launch-job-template'].output.data.id }}.
          Status: ${{ steps['launch-job-template'].output.data.status }}.
          Output: ${{ steps['launch-job-template'].output.data.output }}

    # Conteúdo base do repositório (catalog-info System + README).
    - id: fetch-skeleton
      name: Buscar arquivos base do repositório
      action: fetch:template
      input:
        url: ./skeleton
        values:
          projectName: ${{ parameters.projectName }}
          projectDescription: ${{ parameters.projectDescription }}

    - id: publish-github
      name: Publicar repositório no GitHub
      action: publish:github
      input:
        description: >-
          ${{ parameters.projectDescription or ('Projeto OpenShift ' + parameters.projectName) }}
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.projectName }}
        defaultBranch: main

    - id: register-catalog
      name: Registrar no Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # Dispara o template DeployHttpd como task independente (só publica
    # manifests no Git; o Argo CD sincroniza sozinho).
    - id: trigger-deploy-httpd
      name: Disparar DeployHttpd
      if: ${{ parameters.deployHttpd }}
      action: http:backstage:request
      input:
        method: POST
        path: /scaffolder/v2/tasks
        headers:
          Content-Type: application/json
        body:
          templateRef: template:default/deploy-httpd-aap
          values:
            projectName: ${{ parameters.projectName }}
            githubOwner: ${{ parameters.githubOwner }}
            projectDescription: ${{ parameters.projectDescription }}
            k8sLabelSelector: app=httpd

    - id: log-trigger-deploy-httpd
      name: Registrar disparo do DeployHttpd
      if: ${{ parameters.deployHttpd }}
      action: debug:log
      input:
        message: >-
          Template "DeployHttpd" disparado para o projeto
          "${{ parameters.projectName }}".
          Task ID: ${{ steps['trigger-deploy-httpd'].output.body.id }}.

  output:
    links:
      - title: Ver execução no AAP
        url: ${{ steps['launch-job-template'].output.data.url }}
        icon: dashboard
      - title: Repositório no GitHub
        url: ${{ steps['publish-github'].output.remoteUrl }}
        icon: github
      - title: Abrir no Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
      - title: Ver task do DeployHttpd
        url: >-
          ${{ parameters.deployHttpd and ('/create/tasks/' + steps['trigger-deploy-httpd'].output.body.id) }}
        icon: dashboard
    text:
      - title: Projeto Criado
        content: "${{ parameters.projectName }}"
      - title: ID do Job AAP
        content: "${{ steps['launch-job-template'].output.data.id }}"
      - title: Status AAP
        content: "${{ steps['launch-job-template'].output.data.status }}"
      - title: Task ID do DeployHttpd
        content: "${{ parameters.deployHttpd and steps['trigger-deploy-httpd'].output.body.id }}"
