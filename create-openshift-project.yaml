apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-openshift-project-aap
  title: Create Openshift Project
  description: >-
    Cria um novo projeto no OpenShift via AAP (CreateProject) e, opcionalmente,
    publica manifests do Httpd e registra a Application no Argo CD
  tags:
    - ansible
    - aap
    - argocd
    - gitops
    - openshift
    - v0-6-2
  labels:
    version: 0.6.2
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Ansible Automation Platform
      url: https://aap-hub-aap.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
    - title: Argo CD
      url: https://openshift-gitops-server-openshift-gitops.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: automation
  owner: user:default/victorfim
  lifecycle: production

  parameters:
    - title: Criar Projeto no OpenShift
      description: >
        Este template executa o playbook **CreateProject** (projeto
        Ansible-Examples) no AAP para criar um novo projeto no OpenShift.
        A execução usa suas credenciais do AAP e aguarda o término do job.
        O deploy do Httpd, se solicitado, publica manifests no Git e
        registra uma Application no Argo CD apontando para esse repositório.
      required:
        - projectName
      properties:
        projectName:
          title: Nome do Projeto
          type: string
          description: >-
            Nome do projeto/namespace a ser criado no OpenShift (letras
            minúsculas, números e hífens)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

        displayName:
          title: Nome de Exibição
          type: string
          description: Nome amigável exibido no console do OpenShift (opcional)

        projectDescription:
          title: Descrição do Projeto
          type: string
          description: Descrição do propósito do projeto (opcional)

        deployHttpd:
          title: Incluir deploy do Httpd (Argo CD)
          type: boolean
          description: >-
            Se marcado, publica os manifests do Httpd em manifests/httpd/
            e registra a Application no Argo CD para esse repositório.
            O AAP cria apenas o projeto/namespace.
          default: false

        argoInstance:
          title: Instância do Argo CD
          type: string
          description: >-
            Nome da instância configurada em argocd.appLocatorMethods no
            app-config do RHDH. Usado somente se "Incluir deploy do Httpd"
            estiver marcado.
          default: default

    - title: Repositório
      description: >
        Após a criação do projeto no AAP, um repositório é criado no GitHub
        (com o mesmo nome do projeto) e registrado automaticamente no
        Catalog do Backstage.
      required:
        - githubOwner
      properties:
        githubOwner:
          title: Organização/Owner no GitHub
          type: string
          description: >-
            Organização ou usuário do GitHub onde o repositório será criado.
            O nome do repositório será o mesmo nome do projeto.

  steps:

    # Único step que usa AAP: cria o projeto/namespace no OpenShift.
    - id: launch-job-template
      name: Criar projeto no OpenShift (AAP)
      action: rhaap:launch-job-template
      input:
        token: ${{ environment.secrets.aapToken }}
        waitForCompletion: true
        values:
          # Job Template "CreateProject" do projeto "Ansible-Examples" no AAP
          template: CreateProject
          extraVariables: |-
            project_name: ${{ parameters.projectName }}
            project_display_name: ${{ parameters.displayName }}
            project_description: ${{ parameters.projectDescription }}

    - id: log-output
      name: Registrar resultado da execução AAP
      action: debug:log
      input:
        message: >-
          Job Template "CreateProject" finalizado.
          Job ID: ${{ steps['launch-job-template'].output.data.id }}.
          Status: ${{ steps['launch-job-template'].output.data.status }}.
          Output: ${{ steps['launch-job-template'].output.data.output }}

    # Conteúdo base do repositório (catalog-info System + README).
    - id: fetch-skeleton
      name: Buscar arquivos base do repositório
      action: fetch:template
      input:
        url: ./skeleton
        values:
          projectName: ${{ parameters.projectName }}
          projectDescription: ${{ parameters.projectDescription }}

    # Sobrescreve catalog-info e adiciona manifests/httpd quando o usuário
    # pediu deploy via Argo CD. Publicados juntos no mesmo commit inicial.
    - id: fetch-httpd
      name: Incluir manifests Httpd (GitOps)
      if: ${{ parameters.deployHttpd }}
      action: fetch:template
      input:
        url: ./skeleton-httpd
        values:
          projectName: ${{ parameters.projectName }}
          projectDescription: ${{ parameters.projectDescription }}
          k8sLabelSelector: app=httpd

    - id: publish-github
      name: Publicar repositório no GitHub
      action: publish:github
      input:
        description: >-
          ${{ parameters.projectDescription or ('Projeto OpenShift ' + parameters.projectName) }}
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.projectName }}
        defaultBranch: main

    - id: register-catalog
      name: Registrar no Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # Registra Application no Argo CD apontando para este repositório
    # (path manifests/httpd). Evita que o Argo CD precise varrer todos os repos.
    - id: create-argocd-app
      name: Registrar Application no Argo CD
      if: ${{ parameters.deployHttpd }}
      action: argocd:create-resources
      input:
        appName: ${{ parameters.projectName }}-httpd
        argoInstance: ${{ parameters.argoInstance }}
        namespace: ${{ parameters.projectName }}
        repoUrl: ${{ steps['publish-github'].output.remoteUrl }}
        path: manifests/httpd
        labelValue: ${{ parameters.projectName }}-httpd
        projectName: ${{ parameters.projectName }}-httpd

    - id: log-argocd
      name: Registrar Application Argo CD
      if: ${{ parameters.deployHttpd }}
      action: debug:log
      input:
        message: >-
          Application Argo CD "${{ parameters.projectName }}-httpd" registrada.
          Repo: ${{ steps['publish-github'].output.remoteUrl }}.
          Path: manifests/httpd.
          Namespace destino: ${{ parameters.projectName }}.
          URL: ${{ steps['create-argocd-app'].output.applicationUrl }}

  output:
    links:
      - title: Ver execução no AAP
        url: ${{ steps['launch-job-template'].output.data.url }}
        icon: dashboard
      - title: Repositório no GitHub
        url: ${{ steps['publish-github'].output.remoteUrl }}
        icon: github
      - title: Abrir no Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
      - title: Abrir Application no Argo CD
        url: >-
          ${{ parameters.deployHttpd and steps['create-argocd-app'].output.applicationUrl }}
        icon: dashboard
    text:
      - title: Projeto Criado
        content: "${{ parameters.projectName }}"
      - title: ID do Job AAP
        content: "${{ steps['launch-job-template'].output.data.id }}"
      - title: Status AAP
        content: "${{ steps['launch-job-template'].output.data.status }}"
      - title: Application Argo CD
        content: >-
          ${{ parameters.deployHttpd and (parameters.projectName + '-httpd') or 'não solicitada' }}
