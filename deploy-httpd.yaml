apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-httpd-aap
  title: DeployHttpd
  description: >-
    Gera os manifests do Httpd no repositório do projeto e registra a
    Application no Argo CD para gerenciar o deploy (GitOps)
  tags:
    - argocd
    - gitops
    - httpd
    - openshift
    - v0-4-2
  labels:
    version: 0.4.2
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Argo CD
      url: https://openshift-gitops-server-openshift-gitops.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: service
  owner: user:default/victorfim
  lifecycle: production

  parameters:
    - title: Deploy do Httpd (Argo CD)
      description: >
        Este template gera os manifests Kubernetes/OpenShift do Httpd no
        repositório do projeto (path `manifests/httpd`) e registra uma
        Application no Argo CD apontando para esse path. Assim o Argo CD
        sincroniza só este repositório, sem precisar varrer todos os repos.
      required:
        - projectName
        - githubOwner
        - argoInstance
      properties:
        projectName:
          title: Nome do Projeto
          type: string
          description: >-
            Nome do projeto/namespace no OpenShift onde o httpd será
            implantado (letras minúsculas, números e hífens)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

        githubOwner:
          title: Organização/Owner no GitHub
          type: string
          description: >-
            Organização/owner do repositório no GitHub (criado junto com o
            projeto) onde os manifests e o catalog-info.yaml serão
            publicados

        projectDescription:
          title: Descrição do Projeto
          type: string
          description: Descrição do propósito do projeto (opcional)

        argoInstance:
          title: Instância do Argo CD
          type: string
          description: >-
            Nome da instância configurada em argocd.appLocatorMethods no
            app-config do RHDH (deve coincidir exatamente)
          default: default

        k8sLabelSelector:
          title: Label Selector do Kubernetes (avançado)
          type: string
          description: >-
            Selector usado pelo plugin de Kubernetes do RHDH para localizar
            os recursos do httpd no cluster (ex: "app=httpd").
          default: app=httpd

  steps:

    # Gera catalog-info.yaml (System + Component Httpd) e os manifests
    # em manifests/httpd/ (Deployment, Service, Route, Kustomization).
    - id: fetch-httpd
      name: Gerar manifests Httpd e catalog-info
      action: fetch:template
      input:
        url: ./skeleton-httpd
        values:
          projectName: ${{ parameters.projectName }}
          projectDescription: ${{ parameters.projectDescription }}
          k8sLabelSelector: ${{ parameters.k8sLabelSelector or 'app=httpd' }}

    # Publica via PR no repositório do projeto. Após o merge na branch
    # principal, a Application registrada no Argo CD sincroniza os manifests.
    # OBS: usa um nome de branch fixo. Se o template for executado mais de
    # uma vez para o mesmo projeto, pode ser necessário remover/mesclar o PR
    # anterior antes de rodar novamente.
    - id: publish-httpd-pr
      name: Abrir PR com manifests e catalog-info
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.projectName }}
        branchName: deploy-httpd-argocd
        title: "Adiciona deploy Httpd gerenciado pelo Argo CD"
        description: >-
          Adiciona manifests em manifests/httpd/ e atualiza o
          catalog-info.yaml com o Component do Httpd. Após o merge,
          a Application no Argo CD sincroniza o deploy no namespace
          ${{ parameters.projectName }}.

    - id: log-publish-httpd-pr
      name: Registrar PR aberto
      action: debug:log
      input:
        message: >-
          Pull Request aberto no repositório
          "${{ parameters.githubOwner }}/${{ parameters.projectName }}":
          ${{ steps['publish-httpd-pr'].output.remoteUrl }}

    # Registra Project + Application no Argo CD apontando para este
    # repositório e path — sem depender de varredura de todos os repos.
    - id: create-argocd-app
      name: Registrar Application no Argo CD
      action: argocd:create-resources
      input:
        appName: ${{ parameters.projectName }}-httpd
        argoInstance: ${{ parameters.argoInstance }}
        namespace: ${{ parameters.projectName }}
        repoUrl: https://github.com/${{ parameters.githubOwner }}/${{ parameters.projectName }}.git
        path: manifests/httpd
        labelValue: ${{ parameters.projectName }}-httpd
        projectName: ${{ parameters.projectName }}-httpd

    - id: log-argocd
      name: Registrar Application Argo CD
      action: debug:log
      input:
        message: >-
          Application Argo CD "${{ parameters.projectName }}-httpd" registrada
          na instância "${{ parameters.argoInstance }}", destino namespace
          "${{ parameters.projectName }}", path manifests/httpd.
          URL: ${{ steps['create-argocd-app'].output.applicationUrl }}

  output:
    links:
      - title: Ver Pull Request
        url: ${{ steps['publish-httpd-pr'].output.remoteUrl }}
        icon: github
      - title: Abrir Application no Argo CD
        url: ${{ steps['create-argocd-app'].output.applicationUrl }}
        icon: dashboard
    text:
      - title: Projeto
        content: "${{ parameters.projectName }}"
      - title: Application Argo CD
        content: "${{ parameters.projectName }}-httpd"
      - title: Path dos manifests
        content: manifests/httpd
