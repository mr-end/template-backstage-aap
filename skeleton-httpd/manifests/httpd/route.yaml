apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: httpd
  labels:
    app: httpd
    app.kubernetes.io/name: httpd
    app.kubernetes.io/instance: ${{ values.projectName }}
    backstage.io/kubernetes-id: ${{ values.projectName }}-httpd
spec:
  to:
    kind: Service
    name: httpd
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
