apiVersion: v1
kind: Service
metadata:
  name: httpd
  labels:
    app: httpd
    app.kubernetes.io/name: httpd
    app.kubernetes.io/instance: ${{ values.projectName }}
    backstage.io/kubernetes-id: ${{ values.projectName }}-httpd
spec:
  type: ClusterIP
  selector:
    app: httpd
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
