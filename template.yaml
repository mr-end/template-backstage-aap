apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hello-world-caixa-aap
  title: Hello World Caixa
  description: Executa a automação Hello World Caixa no Ansible Automation Platform
  tags:
    - ansible
    - aap
    - automation
    - caixa
    - v0-0-3
  labels:
    version: 0.0.3
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Ansible Automation Platform
      url: https://aap-hub-aap.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: automation
  owner: team-caixa
  lifecycle: production

  parameters:
    - title: Conexão com o AAP
      description: >
        Escolha como autenticar no AAP. Você pode usar o token padrão configurado
        no ambiente (variável AAP_CONTROLLER_TOKEN) ou informar um token personalizado.
      required:
        - tokenSource
      properties:
        tokenSource:
          title: Origem do Token
          type: string
          description: Selecione a origem do token de autenticação
          default: environment
          enum:
            - environment
            - custom
          enumNames:
            - "Usar token padrão do ambiente (AAP_CONTROLLER_TOKEN)"
            - "Informar token manualmente"
          ui:widget: radio

        customToken:
          title: Token personalizado
          type: string
          description: Informe o token de autenticação do AAP (somente se selecionou "Informar token manualmente")
          ui:widget: password
          ui:options:
            allowEmpty: true

    - title: Configuração do Job Template
      description: >
        Este template executa o playbook **linux_playbook.yml** no AAP
        utilizando o Job Template "Hello World Caixa" da organização CAIXA.
      required:
        - jobTemplate
      properties:
        jobTemplate:
          title: Job Template
          type: string
          description: Selecione o Job Template a ser executado no AAP
          default: Hello World Caixa
          resource: job_templates
          ui:field: AAPResourcePicker
          ui:options:
            autocomplete:
              resource: job_templates
              organization: CAIXA

        inventory:
          title: Inventário
          type: string
          description: Inventário a ser utilizado na execução
          default: Demo Inventory
          resource: inventories
          ui:field: AAPResourcePicker
          ui:options:
            autocomplete:
              resource: inventories
              organization: CAIXA

        verbosity:
          title: Verbosidade
          type: number
          description: Nível de verbosidade da execução
          default: 0
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          enumNames:
            - "0 (Normal)"
            - "1 (Verbose)"
            - "2 (More Verbose)"
            - "3 (Debug)"
            - "4 (Connection Debug)"
          ui:widget: select

        extraVariables:
          title: Variáveis Extra
          type: string
          description: >
            Variáveis extras em formato YAML para passar ao playbook (opcional).
            Exemplo: key: value
          ui:widget: textarea
          ui:options:
            rows: 5

    - title: Confirmação
      description: Revise os dados antes de executar a automação.
      properties:
        confirmExecution:
          title: Confirmo que desejo executar esta automação
          type: boolean
          default: false
          ui:widget: checkbox
      required:
        - confirmExecution

  steps:
    - id: launch-job-template
      name: Executar Job Template no AAP
      action: ansible:jobTemplate:launch
      input:
        jobTemplate: ${{ parameters.jobTemplate }}
        inventory: ${{ parameters.inventory }}
        extraVars: ${{ parameters.extraVariables }}
        verbosity: ${{ parameters.verbosity }}
        connectionDetails:
          token: ${{ parameters.tokenSource === "custom" and parameters.customToken or "$AAP_CONTROLLER_TOKEN" }}

    - id: log-output
      name: Registrar resultado da execução
      action: debug:log
      input:
        message: >
          Job Template "Hello World Caixa" executado com sucesso!
          Job ID: ${{ steps['launch-job-template'].output.jobId }}
          Status: ${{ steps['launch-job-template'].output.status }}

  output:
    links:
      - title: Ver execução no AAP
        url: ${{ steps['launch-job-template'].output.jobUrl }}
        icon: dashboard
    text:
      - title: ID do Job
        content: ${{ steps['launch-job-template'].output.jobId }}
      - title: Status
        content: ${{ steps['launch-job-template'].output.status }}
