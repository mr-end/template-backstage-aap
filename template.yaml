apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hello-world-caixa-aap
  title: Hello World Caixa
  description: Executa a automação Hello World Caixa no Ansible Automation Platform
  tags:
    - ansible
    - aap
    - automation
    - caixa
    - v0-0-11
  labels:
    version: 0.0.11
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Ansible Automation Platform
      url: https://aap-hub-aap.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: automation
  owner: team-caixa
  lifecycle: production

  parameters:
    - title: Diagnóstico - Testar conexão com o AAP
      description: >
        Versão de diagnóstico para identificar o caminho correto da API do AAP.
      properties:
        confirmExecution:
          title: Executar diagnóstico
          type: boolean
          default: false
          ui:widget: checkbox
      required:
        - confirmExecution

  steps:
    - id: test-proxy-root
      name: "Teste 1: GET /api/proxy/ansible-automation-controller/"
      action: http:backstage:request
      input:
        method: GET
        path: /api/proxy/ansible-automation-controller/
        headers:
          Content-Type: application/json
      continueOnError: true

    - id: log-test-1
      name: "Resultado Teste 1"
      action: debug:log
      input:
        message: |
          Teste 1 - /api/proxy/ansible-automation-controller/
          Status: ${{ steps['test-proxy-root'].output.code }}
          Body: ${{ steps['test-proxy-root'].output.body | dump }}

    - id: test-api-v2
      name: "Teste 2: GET /api/proxy/ansible-automation-controller/api/v2/"
      action: http:backstage:request
      input:
        method: GET
        path: /api/proxy/ansible-automation-controller/api/v2/
        headers:
          Content-Type: application/json
      continueOnError: true

    - id: log-test-2
      name: "Resultado Teste 2"
      action: debug:log
      input:
        message: |
          Teste 2 - /api/proxy/ansible-automation-controller/api/v2/
          Status: ${{ steps['test-api-v2'].output.code }}
          Body: ${{ steps['test-api-v2'].output.body | dump }}

    - id: test-controller-v2
      name: "Teste 3: GET /api/proxy/ansible-automation-controller/api/controller/v2/"
      action: http:backstage:request
      input:
        method: GET
        path: /api/proxy/ansible-automation-controller/api/controller/v2/
        headers:
          Content-Type: application/json
      continueOnError: true

    - id: log-test-3
      name: "Resultado Teste 3"
      action: debug:log
      input:
        message: |
          Teste 3 - /api/proxy/ansible-automation-controller/api/controller/v2/
          Status: ${{ steps['test-controller-v2'].output.code }}
          Body: ${{ steps['test-controller-v2'].output.body | dump }}

    - id: test-controller-v2-jt
      name: "Teste 4: GET /api/proxy/ansible-automation-controller/api/controller/v2/job_templates/"
      action: http:backstage:request
      input:
        method: GET
        path: /api/proxy/ansible-automation-controller/api/controller/v2/job_templates/
        headers:
          Content-Type: application/json
      continueOnError: true

    - id: log-test-4
      name: "Resultado Teste 4"
      action: debug:log
      input:
        message: |
          Teste 4 - /api/proxy/ansible-automation-controller/api/controller/v2/job_templates/
          Status: ${{ steps['test-controller-v2-jt'].output.code }}
          Body: ${{ steps['test-controller-v2-jt'].output.body | dump }}

    - id: test-v2-jt
      name: "Teste 5: GET /api/proxy/ansible-automation-controller/api/v2/job_templates/"
      action: http:backstage:request
      input:
        method: GET
        path: /api/proxy/ansible-automation-controller/api/v2/job_templates/
        headers:
          Content-Type: application/json
      continueOnError: true

    - id: log-test-5
      name: "Resultado Teste 5"
      action: debug:log
      input:
        message: |
          Teste 5 - /api/proxy/ansible-automation-controller/api/v2/job_templates/
          Status: ${{ steps['test-v2-jt'].output.code }}
          Body: ${{ steps['test-v2-jt'].output.body | dump }}

  output:
    text:
      - title: Resumo do Diagnóstico
        content: |
          Teste 1 (raiz): ${{ steps['test-proxy-root'].output.code }}
          Teste 2 (/api/v2/): ${{ steps['test-api-v2'].output.code }}
          Teste 3 (/api/controller/v2/): ${{ steps['test-controller-v2'].output.code }}
          Teste 4 (/api/controller/v2/job_templates/): ${{ steps['test-controller-v2-jt'].output.code }}
          Teste 5 (/api/v2/job_templates/): ${{ steps['test-v2-jt'].output.code }}
