apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hello-world-caixa-aap
  title: Hello World Caixa
  description: Executa a automação Hello World Caixa no Ansible Automation Platform
  tags:
    - ansible
    - aap
    - automation
    - caixa
    - v0-0-20
  labels:
    version: 0.0.20
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Ansible Automation Platform
      url: https://aap-hub-aap.apps.cluster-bxnhf.dyn.redhatworkshops.io/
      icon: dashboard
spec:
  type: automation
  owner: team-caixa
  lifecycle: production

  parameters:
    - title: Executar Playbook no AAP
      description: >
        Este template executa o playbook **linux_playbook.yml** no AAP
        utilizando o Job Template "Hello World Caixa" da organização CAIXA.
        A conexão com o AAP é gerenciada automaticamente pela plataforma.
      properties:
        listJobTemplates:
          title: Listar todos os Job Templates antes de executar
          type: boolean
          description: Exibe no log todos os Job Templates disponíveis no AAP
          default: false

        verbosity:
          title: Verbosidade
          type: number
          description: Nível de verbosidade da execução
          default: 0
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          enumNames:
            - "0 (Normal)"
            - "1 (Verbose)"
            - "2 (More Verbose)"
            - "3 (Debug)"
            - "4 (Connection Debug)"
          ui:widget: select

        extraVariables:
          title: Variáveis Extra
          type: string
          description: >
            Variáveis extras em formato YAML para passar ao playbook (opcional).
            Exemplo: key: value
          ui:widget: textarea
          ui:options:
            rows: 5

    - title: Confirmação
      description: Revise os dados antes de executar a automação.
      properties:
        confirmExecution:
          title: Confirmo que desejo executar esta automação
          type: boolean
          default: false
          ui:widget: checkbox
      required:
        - confirmExecution

  steps:
    - id: list-job-templates
      name: Listar todos os Job Templates no AAP
      if: ${{ parameters.listJobTemplates }}
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/ansible-automation-controller/api/controller/v2/job_templates/

    - id: log-job-templates
      name: Exibir Job Templates encontrados
      if: ${{ parameters.listJobTemplates }}
      action: debug:log
      input:
        message: |
          Job Templates encontrados no AAP (total: ${{ steps['list-job-templates'].output.body.count }}):
          ${{ steps['list-job-templates'].output.body.results | dump }}

    - id: find-job-template
      name: Buscar Job Template "Hello World Caixa"
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/ansible-automation-controller/api/controller/v2/job_templates/?id=8

    - id: launch-job-template
      name: Executar Job Template no AAP
      action: http:backstage:request
      input:
        method: POST
        path: >-
          /proxy/ansible-automation-controller/api/controller/v2/job_templates/${{ steps['find-job-template'].output.body.results[0].id }}/launch/
        headers:
          Content-Type: application/json
        body:
          verbosity: ${{ parameters.verbosity }}
          extra_vars: ${{ parameters.extraVariables }}

    - id: log-launch
      name: Registrar disparo do job
      action: debug:log
      input:
        message: >-
          Job ${{ steps['launch-job-template'].output.body.id }} disparado
          (status inicial: ${{ steps['launch-job-template'].output.body.status }}).
          Aguardando a conclusão...

    # ------------------------------------------------------------------
    # Polling do status do job.
    # O scaffolder não tem laço "até que", então cada rodada é um par
    # sleep + GET. Uma rodada só executa se a anterior executou E o job
    # ainda não chegou a um status final; as demais são puladas.
    # Tempo máximo de espera = rodadas x amount (aqui 6 x 10s = 60s).
    # Para jobs mais longos, aumente o amount ou copie mais rodadas.
    # ------------------------------------------------------------------
    - id: wait-1
      name: Aguardar job (rodada 1)
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-1
      name: Consultar status do job (rodada 1)
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: wait-2
      name: Aguardar job (rodada 2)
      if: ${{ steps['status-1'] and steps['status-1'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-2
      name: Consultar status do job (rodada 2)
      if: ${{ steps['status-1'] and steps['status-1'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: wait-3
      name: Aguardar job (rodada 3)
      if: ${{ steps['status-2'] and steps['status-2'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-3
      name: Consultar status do job (rodada 3)
      if: ${{ steps['status-2'] and steps['status-2'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: wait-4
      name: Aguardar job (rodada 4)
      if: ${{ steps['status-3'] and steps['status-3'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-4
      name: Consultar status do job (rodada 4)
      if: ${{ steps['status-3'] and steps['status-3'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: wait-5
      name: Aguardar job (rodada 5)
      if: ${{ steps['status-4'] and steps['status-4'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-5
      name: Consultar status do job (rodada 5)
      if: ${{ steps['status-4'] and steps['status-4'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: wait-6
      name: Aguardar job (rodada 6)
      if: ${{ steps['status-5'] and steps['status-5'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: roadiehq:utils:sleep
      input:
        amount: 10

    - id: status-6
      name: Consultar status do job (rodada 6)
      if: ${{ steps['status-5'] and steps['status-5'].output.body.status not in ['successful','failed','error','canceled'] }}
      action: http:backstage:request
      input:
        method: GET
        logRequestPath: false
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/

    - id: fetch-job-stdout
      name: Obter log de execução do Playbook
      action: http:backstage:request
      input:
        method: GET
        # format=txt devolve texto puro sem códigos ANSI; o plugin da Roadie
        # coloca respostas não-JSON em output.body.message
        path: /proxy/ansible-automation-controller/api/controller/v2/jobs/${{ steps['launch-job-template'].output.body.id }}/stdout/?format=txt

    - id: log-playbook-output
      name: Exibir log do Playbook
      action: debug:log
      input:
        message: |
          ========== LOG DE EXECUÇÃO DO PLAYBOOK ==========
          Job ID: ${{ steps['launch-job-template'].output.body.id }}
          Status Final: ${{ steps['status-6'].output.body.status or steps['status-5'].output.body.status or steps['status-4'].output.body.status or steps['status-3'].output.body.status or steps['status-2'].output.body.status or steps['status-1'].output.body.status }}
          =================================================
          ${{ steps['fetch-job-stdout'].output.body.message }}

  output:
    links:
      - title: Ver execução no AAP
        url: >-
          https://aap-hub-aap.apps.amv6pge9oeeda93d98.eastus.aroapp.io/execution/jobs/playbook/${{ steps['launch-job-template'].output.body.id }}/output
        icon: dashboard
    text:
      - title: ID do Job
        content: "${{ steps['launch-job-template'].output.body.id }}"
      - title: Status final
        content: "${{ steps['status-6'].output.body.status or steps['status-5'].output.body.status or steps['status-4'].output.body.status or steps['status-3'].output.body.status or steps['status-2'].output.body.status or steps['status-1'].output.body.status }}"